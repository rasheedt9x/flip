# raylib-android game (see the kit's NOTES.md). `kit.sh new` fills these in.
NAME=flip               # APK file name
LABEL="Flip"            # app name under the icon
PACKAGE=local.flip      # Android package id; changing it makes a separate app
ORIENTATION=portrait    # portrait | landscape | sensorLandscape | fullSensor ...
DEV_PORT=47587          # hot reload server port (127.0.0.1); each game gets its own
NETWORK=no              # yes = the release APK may use the internet (kit/net.h); dev builds always can
LIBS="jnigraphics"      # AImageDecoder: webp/jpg/png decoding by the phone itself
PERMS="MANAGE_EXTERNAL_STORAGE"  # read .cbz files anywhere (grant once: appops, see NOTES.md)
